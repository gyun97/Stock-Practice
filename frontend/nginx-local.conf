server {
    listen 80;
    server_name localhost;

    # Nginx를 통해 docker-compose 내부의 app:8080 으로 라우팅
    # docker-compose.local-prod.yml 에서는 app 컨테이너 이름을 stock-app-local 로 지정할 것입니다.
    # 혹은 backend 컨테이너 변수로 처리 (여기서는 단순하게 고정)
    
    # 도커 내부 DNS 서버
    resolver 127.0.0.11 valid=30s ipv6=off; 

    # CORS 설정 등을 위한 기본 라우팅 막기
    location / {
        return 404;
    }

    # 변수를 이용해 Nginx 시작 시점에 App 컨테이너가 없어도 죽지 않도록 설정
    set $backend "http://stock-app-local:8080";

    location /api {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /actuator {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
