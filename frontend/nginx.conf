server {
    listen 80;
    server_name api.stock-king.co.kr;

    # Certbot ACME Challenge용 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.stock-king.co.kr;

    include /etc/nginx/conf.d/service-env.inc;

    # 도커 내부 DNS 서버 (변수를 이용한 proxy_pass 시 필수)
    resolver 127.0.0.11 valid=30s; 

    # SSL 인증서 경로 (서브도메인 전용 인증서 사용)
    ssl_certificate /etc/letsencrypt/live/api.stock-king.co.kr/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/api.stock-king.co.kr/privkey.pem;
    
    # SSL 최적화 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # CORS 설정을 위해 location / 에서 리다이렉트나 프록시 처리 대신 간단히 404 혹은 안내 메시지
    location / {
        return 404;
    }

    location /api {
        proxy_pass $service_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /ws {
        proxy_pass $service_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        
        # WebSocket 안정성을 위한 타임아웃 및 버퍼링 설정
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Actuator 엔드포인트 보안 강화 (Prometheus 수집 허용, 외부 접근 제한/인증)
    location /actuator {
        # 내부 도커 네트워크에서의 접근은 허용하고, 외부에서의 접근은 제한하거나 인증을 추가할 수 있습니다.
        # 여기서는 간단히 외부 노출 시 민감한 정보가 포함될 수 있음을 주의하며 프록시 설정을 유지하되,
        # 필요한 경우 basic_auth 등을 추가할 수 있습니다.
        proxy_pass $service_url;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        
        # 외부 직접 접근 시 인증 추가 (선택 사항)
        # auth_basic "Restricted Actuator";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }

    location /oauth2 {
        proxy_pass $service_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /login/oauth2 {
        proxy_pass $service_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
    }
}


