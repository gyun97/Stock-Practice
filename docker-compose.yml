version: '3.8'

services:

  # -----------------
  # MySQL
  # -----------------
  mysql:
    image: mysql:8
    container_name: stock-mysql
    environment:
      MYSQL_ROOT_NAME: "${MYSQL_NAME}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # -----------------
  # Redis Master
  # -----------------
  redis_master:
    image: bitnami/redis
    container_name: redis-master
    hostname: redis-master
    environment:
      - REDIS_REPLICATION_MODE=master
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "${REDIS_PORT}:6379"

  # -----------------
  # Redis Replica
  # -----------------
  redis_replica1:
    image: bitnami/redis
    container_name: redis-replicas-1
    hostname: redis-replicas-1
    environment:
      - REDIS_REPLICATION_MODE=slave
      - REDIS_MASTER_HOST=redis-master
      - ALLOW_EMPTY_PASSWORD=yes
    depends_on:
      - redis_master
    ports:
      - "${REDIS_REPLICA_PORT1}:6379"

  # -----------------
  # Redis Sentinel 1
  # -----------------
  redis-sentinel-1:
    image: bitnami/redis-sentinel:latest
    container_name: sentinel1
    environment:
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_PORT_NUMBER=6379
      - REDIS_MASTER_SET=mymaster
      - REDIS_SENTINEL_QUORUM=2
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=10000
    depends_on:
      - redis_master
      - redis_replica1
    ports:
      - "${REDIS_SENTINEL_PORT1}:26379"

  # -----------------
  # Redis Sentinel 2
  # -----------------
  redis-sentinel-2:
    image: bitnami/redis-sentinel:latest
    container_name: sentinel2
    environment:
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_PORT_NUMBER=6379
      - REDIS_MASTER_SET=mymaster
      - REDIS_SENTINEL_QUORUM=2
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=10000
    depends_on:
      - redis_master
      - redis_replica1
    ports:
      - "${REDIS_SENTINEL_PORT2}:26379"

  # -----------------
  # Redis Sentinel 3
  # -----------------
  redis-sentinel-3:
    image: bitnami/redis-sentinel:latest
    container_name: sentinel3
    environment:
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_PORT_NUMBER=6379
      - REDIS_MASTER_SET=mymaster
      - REDIS_SENTINEL_QUORUM=2
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=10000
    depends_on:
      - redis_master
      - redis_replica1
    ports:
      - "${REDIS_SENTINEL_PORT3}:26379"
  # -----------------
  # Spring Boot App
  # -----------------
  app:
    env_file:
      - .env.local
    build: .
    container_name: stock-app
    depends_on:
      mysql:
        condition: service_healthy
      redis_master:
        condition: service_started
      redis-sentinel-1:
        condition: service_started
      logstash:
        condition: service_started
      jaeger:
        condition: service_started
    #    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_SENTINEL_NODE1: sentinel1:26379
      REDIS_SENTINEL_NODE2: sentinel2:26379
      REDIS_SENTINEL_NODE3: sentinel3:26379
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5044
    ports:
      - "8080:8080"

  # =================================================
  # 모니터링 스택
  # =================================================

  # -----------------
  # Prometheus (메트릭 수집)
  # -----------------
  prometheus:
    image: prom/prometheus:latest
    container_name: stock-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      - app
    restart: unless-stopped

  # -----------------
  # Grafana (시각화 대시보드)
  # -----------------
  grafana:
    image: grafana/grafana:latest
    container_name: stock-grafana
    ports:
      - "3001:3000"  # 프론트엔드 3000 포트와 충돌 방지
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    depends_on:
      - prometheus
      - elasticsearch
      - jaeger
    restart: unless-stopped

  # -----------------
  # AlertManager (알림 발송)
  # -----------------
  alertmanager:
    image: prom/alertmanager:latest
    container_name: stock-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    restart: unless-stopped

  # -----------------
  # Jaeger (분산 추적, all-in-one)
  # -----------------
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: stock-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "9411:9411"    # Zipkin 호환 수신 (Spring Boot 전송)
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=9411
    restart: unless-stopped

  # -----------------
  # Elasticsearch (로그 저장)
  # -----------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: stock-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false       # 로컬 개발용: 보안 비활성화
      - ES_JAVA_OPTS=-Xms512m -Xmx512m    # 메모리 제한 (최소 512MB)
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'yellow\\|green'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # -----------------
  # Logstash (로그 파이프라인)
  # -----------------
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: stock-logstash
    ports:
      - "5044:5044"  # TCP (Spring Boot LogstashAppender)
    volumes:
      - ./monitoring/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - MONITORING_ENABLED=false           # X-Pack 모니터링 비활성화
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # -----------------
  # Kibana (로그 시각화)
  # -----------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: stock-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
