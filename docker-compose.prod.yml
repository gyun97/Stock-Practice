# 서버(EC2)에 두어 배포 환경에서 실행할 docker-compose.prod.yml 파일입니다.

services:

  # -----------------
  # MySQL
  # -----------------
  mysql:
    image: mysql:8
    container_name: stock-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # -----------------
  # Redis Standalone
  # -----------------
  redis:
    image: bitnami/redis
    container_name: stock-redis
    hostname: redis
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - redis_data:/bitnami/redis/data
    ports:
      - "6379:6379"

  # -----------------
  # Nginx Proxy (API Subdomain)
  # -----------------
  nginx:
    image: nginx:stable-alpine
    container_name: stock-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/service-env.inc:/etc/nginx/conf.d/service-env.inc
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  # -----------------
  # Certbot (SSL Certificate)
  # -----------------
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certbot renew --quiet && sleep 12h

  # -----------------
  # Spring Boot App (Blue)
  # -----------------
  app-blue:
    image: ${DOCKER_USERNAME}/stock-app:latest
    container_name: stock-app-blue
    environment:
      - SPRING_PROFILES_ACTIVE=prod,set1
    env_file:
      - .env.prod
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    ports:
      - "8081:8080"

  # -----------------
  # Spring Boot App (Green)
  # -----------------
  app-green:
    image: ${DOCKER_USERNAME}/stock-app:latest
    container_name: stock-app-green
    environment:
      - SPRING_PROFILES_ACTIVE=prod,set2
    env_file:
      - .env.prod
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    ports:
      - "8082:8080"

  # =================================================
  # 모니터링 스택 (prod)
  # =================================================

  # -----------------
  # Prometheus
  # -----------------
  prometheus:
    image: prom/prometheus:latest
    container_name: stock-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  # -----------------
  # Grafana
  # -----------------
  grafana:
    image: grafana/grafana:latest
    container_name: stock-grafana
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped

  # -----------------
  # AlertManager
  # -----------------
  alertmanager:
    image: prom/alertmanager:latest
    container_name: stock-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    restart: unless-stopped

  # -----------------
  # Jaeger (all-in-one)
  # -----------------
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: stock-jaeger
    ports:
      - "16686:16686"  # UI
      - "9411:9411"    # Zipkin 수신
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=9411
    restart: unless-stopped

  # -----------------
  # Loki (경량형 로그 저장소)
  # -----------------
  loki:
    image: grafana/loki:latest
    container_name: stock-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  # -----------------
  # Alloy (로그 수집기 - Promtail 후속)
  # -----------------
  alloy:
    image: grafana/alloy:latest
    container_name: stock-alloy
    ports:
      - "12345:12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker 컨테이너 로그를 읽기 위해 필수
    command: 
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
