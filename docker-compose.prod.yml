# 서버(EC2)에 두어 배포 환경에서 실행할 docker-compose.prod.yml 파일입니다.

services:

  # -----------------
  # MySQL
  # -----------------
  mysql:
    image: mysql:8
    container_name: stock-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # -----------------
  # Redis Standalone
  # -----------------
  redis:
    image: bitnami/redis
    container_name: stock-redis
    hostname: redis
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - redis_data:/bitnami/redis/data
    ports:
      - "6379:6379"

  # -----------------
  # Nginx Proxy (API Subdomain)
  # -----------------
  nginx:
    image: nginx:stable-alpine
    container_name: stock-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/service-env.inc:/etc/nginx/conf.d/service-env.inc
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro

  # -----------------
  # Certbot (SSL Certificate)
  # -----------------
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    command: certbot renew --quiet && sleep 12h

  # -----------------
  # Spring Boot App (Blue)
  # -----------------
  app-blue:
    image: ${DOCKER_USERNAME}/stock-app:latest
    container_name: stock-app-blue
    environment:
      - SPRING_PROFILES_ACTIVE=prod,set1
    env_file:
      - .env.prod
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    ports:
      - "8081:8080"

  # -----------------
  # Spring Boot App (Green)
  # -----------------
  app-green:
    image: ${DOCKER_USERNAME}/stock-app:latest
    container_name: stock-app-green
    environment:
      - SPRING_PROFILES_ACTIVE=prod,set2
    env_file:
      - .env.prod
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    ports:
      - "8082:8080"

  # =================================================
  # 모니터링 스택 (Grafana Cloud 이전)
  # =================================================

  # -----------------
  # Alloy (로그 및 메트릭 수집기)
  # -----------------
  alloy:
    image: grafana/alloy:latest
    container_name: stock-alloy
    ports:
      - "12345:12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GRAFANA_CLOUD_PROMETHEUS_URL=${GRAFANA_CLOUD_PROMETHEUS_URL}
      - GRAFANA_CLOUD_PROMETHEUS_USER=${GRAFANA_CLOUD_PROMETHEUS_USER}
      - GRAFANA_CLOUD_LOKI_URL=${GRAFANA_CLOUD_LOKI_URL}
      - GRAFANA_CLOUD_LOKI_USER=${GRAFANA_CLOUD_LOKI_USER}
      - GRAFANA_CLOUD_API_KEY=${GRAFANA_CLOUD_API_KEY}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:


