# 로컬 환경에서 운영 환경(메모리 1GB, CPU 1 코어 제한 등)을 모사하여 부하 테스트 연습을 진행하기 위한 설정입니다.

services:

  # -----------------
  # MySQL
  # -----------------
  mysql:
    image: mysql:8
    container_name: stock-mysql-local
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD:-1234}"
      MYSQL_DATABASE: "stock"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_local:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # -----------------
  # Redis Standalone
  # -----------------
  redis:
    image: bitnami/redis
    container_name: stock-redis-local
    hostname: redis
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - redis_data_local:/bitnami/redis/data
    ports:
      - "6379:6379"

  # -----------------
  # Nginx Proxy (Local Subdomain)
  # -----------------
  nginx:
    image: nginx:stable-alpine
    container_name: stock-nginx-local
    depends_on:
      - app
    ports:
      - "8888:80"
    volumes:
      - ./frontend/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro

  # -----------------
  # Spring Boot App (Local Prod)
  # -----------------
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: stock-app-local
    environment:
      # 개발 프로필과 로컬 환경 설정 적용
      - SPRING_PROFILES_ACTIVE=dev,set1
      # JVM 힙 메모리 설정
      - JAVA_TOOL_OPTIONS=-Xmx384m
      # 컨테이너 네트워크용 호스트 설정
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
    env_file:
      - .env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          # EC2 micro 환경(총 1GB RAM)을 고려하여 App 자체의 리소스 허용치를 제한합니다.
          cpus: '1.5'
          memory: 600M

  # =================================================
  # 모니터링 스택 (Grafana Cloud 이전)
  # =================================================
  # -----------------
  # Alloy (로그 및 메트릭 수집기)
  # -----------------
  alloy:
    image: grafana/alloy:latest
    container_name: stock-alloy-local
    ports:
      - "12345:12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env.prod
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    restart: unless-stopped

volumes:
  mysql_data_local:
  redis_data_local:
