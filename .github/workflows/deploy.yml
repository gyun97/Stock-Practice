name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'            # 백엔드 코드가 바뀔 때만 실행
      - '!docker-compose.yml' # 로컬 설정이 바뀔 때는 이 워크플로우 제외
      - 'docker-compose.prod.yml' # 운영 설정이 바뀔 때 실행
      - 'scripts/**'         # 배포 스크립트가 바뀔 때 실행
      - '.github/workflows/deploy.yml' # 워크플로우 자체가 바뀔 때 실행
      - '!frontend/**'       # 프론트엔드 폴더 내 파일이 바뀔 때는 이 워크플로우 제외

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/stock-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            # 1. 프로젝트 폴더로 위치 이동
            cd /home/ubuntu/stock 
            
            # 2. 최신 코드 레포지토리 가져오기 (충돌 방지를 위해 reset 사용)
            git fetch origin main
            git reset --hard origin/main
            
            # 3. 배포 환경용 .env.prod 파일 생성 및 변수 로드
            echo "${{ secrets.ENV_PROD }}" > .env.prod
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env.prod
            
            # 4. 서버에서 Docker Hub 로그인 (Private 이미지 Pull 권한 확보)
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # 5. 환경변수 로드 및 최신 도커 이미지 Pull (docker compose v2)
            set -a && source .env.prod && set +a
            docker compose -f docker-compose.prod.yml pull
            
            # 6. 무중단 배포 스크립트 실행
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
            
            # 7. 정리
            docker image prune -f
            docker logout
