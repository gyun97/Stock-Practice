kis:
  app:
    key: ${KIS_APP_KEY}
    secret: ${KIS_APP_SECRET}
  url:
    rest: ${KIS_REST_URL:https://openapivts.koreainvestment.com:29443}
    ws: ${KIS_WS_URL:ws://ops.koreainvestment.com:31000}


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,mappings
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: stock-app
      env: dev
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans  # Jaeger Zipkin 수신 포트

tracing:
  sampling:
    probability: 1.0  # 로컬 전체 트레이싱

logstash:
  host: localhost
  port: 5044

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  
# 쿠키 보안 설정
cookie:
  secure: false  # localhost(HTTP)에서는 false, HTTPS에서는 true
  domain: null  # localhost에서는 null, 프로덕션에서는 실제 도메인

server:
  forward-headers-strategy: framework  # Nginx 등의 프록시 환경에서 HTTPS 인식을 위해 필수

spring:
  config:
    import: optional:file:.env.local[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:stock}
    username: ${MYSQL_NAME}
    password: ${MYSQL_PASSWORD}
    # username: ${DB_USERNAME_LOCAL:root}
    # password: ${DB_PASSWORD_LOCAL:1234}

    hikari:
      initialization-fail-timeout: 60000
      connection-timeout: 30000

  jpa:
    hibernate:
#      ddl-auto: update
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        open-in-view: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URL}
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - account_email
              - profile_image
            client-authentication-method: client_secret_post
            client-name: Kakao
          naver: # 네이버 OAuth 설정 추가
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            scope:
              - email
              - nickname
            client-name: Naver
            redirect-uri: ${NAVER_REDIRECT_URL}
            authorization-grant-type: authorization_code

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}


  flyway:
    enabled: true  # flyway 

    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:stock}
    username: ${MYSQL_NAME}
    password: ${MYSQL_PASSWORD}
    # username: ${DB_USERNAME_LOCAL:root}
    # password: ${DB_PASSWORD_LOCAL:1234}
    baseline-on-migrate: true 
    locations: classpath:db/migration/{vendor} 

  logging:
    level:
      com.zaxxer.hikari: INFO
      org.springframework.jdbc: INFO
      org.hibernate.orm.jdbc.bind: OFF
