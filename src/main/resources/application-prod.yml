# 프로덕션 환경 설정
# HTTPS를 사용하는 환경에서 사용

kis:
  app:
    key: ${KIS_APP_KEY}
    secret: ${KIS_APP_SECRET}
  url:
    rest: ${KIS_REST_URL:https://openapi.koreainvestment.com:9443}
    ws: ${KIS_WS_URL:ws://ops.koreainvestment.com:21000}

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  
# 쿠키 보안 설정
cookie:
  secure: true  # HTTPS 환경에서는 true로 설정
  domain: ${COOKIE_DOMAIN:}  # 실제 도메인 설정 (예: .example.com), 비어있으면 IP 주소 기반 동작


server:
  port: 8080
  shutdown: graceful  # 우아한 종료 설정 추가
  forward-headers-strategy: framework  # 'native'보다 'framework'가 필터 기반으로 동작하여 더 안정적임

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: stock-app
      env: prod
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://alloy:4318/v1/traces}
  tracing:
    sampling:
      probability: 0.1


spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s  # 종료 시 최대 대기 시간 설정
  config:
    import: optional:file:.env.prod[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul
    username: ${MYSQL_NAME}
    password: ${MYSQL_PASSWORD}

    hikari:
      register-mbeans: true

  jpa:
    hibernate:
    properties:
      hibernate:
        open-in-view: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URL}
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - account_email
              - profile_image
            client-authentication-method: client_secret_post
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            scope:
              - email
              - nickname
            client-name: Naver
            redirect-uri: ${NAVER_REDIRECT_URL}
            authorization-grant-type: authorization_code

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      timeout: 3s  # Redis 서버 응답 대기 시간 (ms)
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1s  # 커넥션 획득 대기 시간 (ms)
        shutdown-timeout: 2000

  flyway:
    enabled: true  
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul  
    username: ${MYSQL_NAME}
    password: ${MYSQL_PASSWORD}  
    baseline-on-migrate: true  
    validate-on-migrate: false
    repair-on-migrate: true
    locations: classpath:db/migration/{vendor}

logging:
  level:
    root: INFO
    com.project.demo: INFO
    org.redisson: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"