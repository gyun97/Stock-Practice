input {
  # Spring Boot 앱에서 LogstashTcpSocketAppender로 전송된 JSON 로그 수신
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # ──────────────────────────────────────────
  # 타임스탬프 파싱
  # ──────────────────────────────────────────
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # ──────────────────────────────────────────
  # 로그 레벨 정규화 (대문자)
  # ──────────────────────────────────────────
  if [level] {
    mutate {
      uppercase => ["level"]
    }
  }

  # ──────────────────────────────────────────
  # traceId / spanId 필드 보존 (Jaeger 연동용)
  # ──────────────────────────────────────────
  if [mdc] {
    if [mdc][traceId] {
      mutate {
        add_field => { "trace_id" => "%{[mdc][traceId]}" }
      }
    }
    if [mdc][spanId] {
      mutate {
        add_field => { "span_id" => "%{[mdc][spanId]}" }
      }
    }
  }

  # ──────────────────────────────────────────
  # 불필요한 필드 제거
  # ──────────────────────────────────────────
  mutate {
    remove_field => ["@version", "port", "host"]
  }
}

output {
  # Elasticsearch 저장 (인덱스: stock-logs-YYYY.MM.dd)
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "stock-logs-%{+YYYY.MM.dd}"
    # ILM(Index Lifecycle Management)을 사용할 경우 아래 주석 해제
    # ilm_enabled => true
    # ilm_rollover_alias => "stock-logs"
    # ilm_policy => "7-days-default"
  }

  # 디버깅용 콘솔 출력 (필요 시 주석 해제)
  # stdout {
  #   codec => rubydebug
  # }
}
