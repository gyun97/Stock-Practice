apiVersion: 1

providers:
  - name: "Stock App Dashboards"
    orgId: 1
    folder: "Stock App"
    folderUid: "stock-app"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
