apiVersion: 1

datasources:
  # ──────────────────────────────────────────
  # 1. Prometheus (메트릭)
  # ──────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST

  # ──────────────────────────────────────────
  # 2. Elasticsearch (로그)
  # ──────────────────────────────────────────
  - name: Elasticsearch
    uid: "elasticsearch-ds"  # 명시적 UID 추가
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    isDefault: false
    editable: false
    jsonData:
      index: "stock-logs-*"
      timeField: "@timestamp"
      esVersion: "8.0.0"
      maxConcurrentShardRequests: 5
      logMessageField: "message"
      logLevelField: "level"

  # ──────────────────────────────────────────
  # 3. Jaeger (분산 추적)
  # ──────────────────────────────────────────
  - name: Jaeger
    uid: "jaeger-ds"
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    isDefault: false
    editable: false
    jsonData:
      tracesToLogs:
        datasourceUid: "loki-ds" # Loki와 연동
        filterByTraceID: true
        filterBySpanID: false
        # 태그 형식을 문자열 리스트로 수정
        tags: ["trace_id"]

  # 4. Loki (로그 보관 - Prod 및 경량 모니터링)
  - name: Loki
    uid: "loki-ds"
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
